[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
cobs = { version = "0.5.1", default-features = false }
crc = { version = "3.4.0", default-features = false }
postcard = { version = "1.1.3", features = ["use-crc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
unit-intervals = { version = "0.1.0", default-features = false, features = ["serde"] } # might want to switch away from this since it's EUPL
